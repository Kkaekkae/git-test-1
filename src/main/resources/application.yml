spring:
  application:
    name: elk
  data:
    elasticsearch:
      host: localhost:9200
      username: elastic
      password: password # 'ELK ?? ??' ???? ??? .env ? ?? ???? ?
      repositories:
        enabled: true
management:
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
server:
  port: 8100